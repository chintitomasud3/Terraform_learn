name: Deploy App

on:
  push:
    branches: [main]

# একই ব্রাঞ্চে একাধিক ডিপ্লয় একসাথে রান না করে নতুনটা শুরু করুক
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy FastAPI via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BE_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/backend
            git fetch origin main
            git reset --hard origin/main
            source venv/bin/activate
            pip install -r requirements.txt --quiet --upgrade
            systemctl restart fastapi

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend  # Optional: Backend আগে ডিপ্লয় হোক
    steps:
      - name: Deploy Node.js via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.FE_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /var/www/frontend
            git fetch origin main
            git reset --hard origin/main
            npm install --production --quiet
            npm run build
            # বিল্ড আউটপুট Nginx রুটে কপি করো (তোমার প্রজেক্ট অনুযায়ী পথ চেঞ্জ করো)
            sudo cp -r dist/* /var/www/html/
            sudo systemctl reload nginx
